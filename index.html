 6.23,34.96 6.23,31.36 9.35,29.56 12.47,31.36" fill="#4a5461" stroke="#161b22" stroke-width="0.9" stroke-linejoin="round"/><circle cx="9.35" cy="33.16" r="1.9" fill="#232a33" stroke="#8e99a8" stroke-width="0.5"/><polygon points="36.28,11.15 33.16,12.95 30.04,11.15 30.04,7.55 33.16,5.75 36.28,7.55" fill="#4a5461" stroke="#161b22" stroke-width="0.9" stroke-linejoin="round"/><circle cx="33.16" cy="9.35" r="1.9" fill="#232a33" stroke="#8e99a8" stroke-width="0.5"/><polygon points="69.96,11.15 66.84,12.95 63.72,11.15 63.72,7.55 66.84,5.75 69.96,7.55" fill="#4a5461" stroke="#161b22" stroke-width="0.9" stroke-linejoin="round"/><circle cx="66.84" cy="9.35" r="1.9" fill="#232a33" stroke="#8e99a8" stroke-width="0.5"/><polygon points="93.77,34.96 90.65,36.76 87.53,34.96 87.53,31.36 90.65,29.56 93.77,31.36" fill="#4a5461" stroke="#161b22" stroke-width="0.9" stroke-linejoin="round"/><circle cx="90.65" cy="33.16" r="1.9" fill="#232a33" stroke="#8e99a8" stroke-width="0.5"/><circle cx="50" cy="50" r="38" fill="url(#og3)" stroke="#c4cdd9" stroke-width="1.3"/><circle cx="50" cy="50" r="20" fill="#46515f" stroke="#6f86a6" stroke-width="1"/><circle cx="50" cy="50" r="29" fill="none" stroke="#2a323c" stroke-opacity="0.45" stroke-width="5.4" transform="translate(0.5 0.8)"/><path d="M50 50L50.00 79.00" stroke="#f7fafd" stroke-width="3.4" stroke-linecap="round"/><path d="M50 50L24.89 35.50" stroke="#f7fafd" stroke-width="3.4" stroke-linecap="round"/><path d="M50 50L75.11 35.50" stroke="#f7fafd" stroke-width="3.4" stroke-linecap="round"/><circle cx="50" cy="50" r="29" fill="none" stroke="#f7fafd" stroke-width="4.4"/><circle cx="50" cy="50" r="29" fill="none" stroke="#fff" stroke-width="1" opacity="0.9" transform="translate(-0.7 -0.7)"/><circle cx="50" cy="50" r="6.6" fill="url(#og1)" stroke="#4a5563" stroke-width="0.8"/><circle cx="50" cy="50" r="4.4" fill="#8993a1" stroke="#e8eef5" stroke-width="0.7"/><circle cx="50" cy="50" r="3.1" fill="url(#og4)"/></svg><div class="tt"></div></div><svg class="seam"><path d="M0 0"/></svg></div></div></div>
<script>
const N = 6;
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const gameoverScreen = document.getElementById('gameover');
const finalScore = document.getElementById('final-score');

// 方格外多留一圈邊界，用來顯示箭頭提示
const avail = Math.min(window.innerWidth - 8, window.innerHeight - 120, 560);
const cell = Math.max(36, Math.floor(avail / (N + 1.0)));
const size = cell * N;
const pad = Math.max(cell * 0.5, Math.floor(Math.min(window.innerWidth - size, window.innerHeight - 120 - size) / 2));
canvas.width = size + 2 * pad;
canvas.height = size + 2 * pad;
document.getElementById('bar').style.width = canvas.width + 'px';
const outer = document.getElementById('outer'), octx = outer.getContext('2d');
let outerKey = '';
function syncOuter() {
  const show = !inMenu && canvas.offsetParent !== null;
  outer.style.display = show ? 'block' : 'none';
  if (!show) return;
  const r = canvas.getBoundingClientRect(), W = innerWidth, H = innerHeight, key = level + '|' + Math.round(r.x) + '|' + Math.round(r.y) + '|' + W + '|' + H;
  if (key === outerKey) return;
  outerKey = key; outer.width = W * 1.06; outer.height = H * 1.06;
  const B = level === 'laser' ? bgVault : level === 'missile' ? bgSea : level === 'balloon' ? bgPark : bg2, bw = r.width, bh = r.height, sh = Math.max(3, Math.round(pad * 0.12)), e = 24, o = [W * 0.03, H * 0.03];
  const x0 = r.x + o[0], y0 = r.y + o[1], x1 = x0 + bw, y1 = y0 + bh, OW = outer.width, OH = outer.height;
  if (level === 'laser') {
    const wg = octx.createLinearGradient(0, 0, OW, OH); wg.addColorStop(0, '#46505e'); wg.addColorStop(0.5, '#363e4a'); wg.addColorStop(1, '#2a313b'); octx.fillStyle = wg; octx.fillRect(0, 0, OW, OH);
    const ps = 118, ox = x0 % ps, oy = y0 % ps;
    for (let gx = ox - ps; gx < OW; gx += ps) for (let gy = oy - ps; gy < OH; gy += ps) {
      octx.fillStyle = 'rgba(255,255,255,0.07)'; octx.fillRect(gx + 2, gy + 2, ps - 4, 3); octx.fillRect(gx + 2, gy + 2, 3, ps - 4);
      octx.fillStyle = 'rgba(0,0,0,0.35)'; octx.fillRect(gx + 2, gy + ps - 5, ps - 4, 3); octx.fillRect(gx + ps - 5, gy + 2, 3, ps - 4);
      octx.strokeStyle = 'rgba(8,10,14,0.85)'; octx.lineWidth = 2; octx.strokeRect(gx, gy, ps, ps);
      [[14, 14], [ps - 14, 14], [14, ps - 14], [ps - 14, ps - 14]].forEach(q => { octx.fillStyle = '#1b2028'; octx.beginPath(); octx.arc(gx + q[0], gy + q[1], 4.5, 0, Math.PI * 2); octx.fill(); octx.fillStyle = 'rgba(190,200,215,0.55)'; octx.beginPath(); octx.arc(gx + q[0] - 1, gy + q[1] - 1, 1.6, 0, Math.PI * 2); octx.fill(); });
    }
    for (let k = 0; k < 160; k++) { octx.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.06)'; octx.fillRect(Math.random() * OW, Math.random() * OH, 60 + Math.random() * 120, 1); }
  } else {
  octx.drawImage(B, 0, 0, bw, sh, x0, -2, bw, y0 + e + 2);
  octx.drawImage(B, 0, bh - sh, bw, sh, x0, y1 - e, bw, OH - y1 + e + 2);
  octx.drawImage(B, 0, 0, sh, bh, -2, y0, x0 + e + 2, bh);
  octx.drawImage(B, bw - sh, 0, sh, bh, x1 - e, y0, OW - x1 + e + 2, bh);
  octx.drawImage(B, 0, 0, sh, sh, -2, -2, x0 + e + 2, y0 + e + 2);
  octx.drawImage(B, bw - sh, 0, sh, sh, x1 - e, -2, OW - x1 + e + 2, y0 + e + 2);
  octx.drawImage(B, 0, bh - sh, sh, sh, -2, y1 - e, x0 + e + 2, OH - y1 + e + 2);
  octx.drawImage(B, bw - sh, bh - sh, sh, sh, x1 - e, y1 - e, OW - x1 + e + 2, OH - y1 + e + 2);
  }
  octx.fillStyle = level === 'laser' ? 'rgba(8,10,14,0.22)' : 'rgba(8,10,14,0.4)'; octx.fillRect(0, 0, OW, OH);
}
setInterval(syncOuter, 150);

let player, hazards, particles, startTime, isGameOver, spawnTimer, shakeTime;
let craters = [];

function init() {
  player = { c: 2, r: 2, px: 2.5 * cell, py: 2.5 * cell, walk: 0 };
  hazards = [];
  craters = [];
  particles = [];
  startTime = Date.now();
  isGameOver = false;
  spawnTimer = 0;
  shakeTime = 0;
  gameoverScreen.style.display = 'none';
  ui.innerText = '0.00 秒';
}

// 點擊螢幕：火柴人像拍照一樣定格擺 pose（迪斯可指天、秀肌肉、金雞獨立），隨機挑一個，不會連續重複
let lastPose = -1;
function doPose() {
  let t; do { t = Math.floor(Math.random() * 3); } while (t === lastPose);
  lastPose = t;
  player.pose = { type: t, t0: performance.now(), dur: 1300 };
}

function move(dc, dr) {
  if (isGameOver || inMenu || paused || transitioning) return;
  const nc = Math.max(0, Math.min(N - 1, player.c + dc));
  const nr = Math.max(0, Math.min(N - 1, player.r + dr));
  if (nc !== player.c || nr !== player.r) {
    player.c = nc; player.r = nr;
    player.walk += 2;
    player.step = { dc, dr, t0: performance.now() };
    player.pose = null; // 走動時取消 pose
    sfxMove();
  }
}

// 滑動操作：滑一下 = 走一格
const SWIPE_MIN = 20;
let start = null;
window.addEventListener('pointerdown', e => { start = { x: e.clientX, y: e.clientY, t: Date.now() }; });
window.addEventListener('pointermove', e => {
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  if (Math.hypot(dx, dy) < SWIPE_MIN) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
  else move(0, dy > 0 ? 1 : -1);
  start = null; // 這一滑只算一格，需放開再滑
});
window.addEventListener('pointerup', e => {
  // 點一下（沒有滑動、按得很短、不是按在按鈕上）= 擺 pose
  if (start && !inMenu && !paused && !isGameOver && !transitioning && !(e.target.closest && e.target.closest('button')) && Date.now() - start.t < 500) doPose();
  start = null;
});
window.addEventListener('pointercancel', () => { start = null; });
window.addEventListener('keydown', e => {
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (k) { e.preventDefault(); move(k[0], k[1]); }
});
document.getElementById('restart').addEventListener('click', init);

// 生成陷阱：整列或整行先閃紅色警告，再射出子彈
function spawnHazard(horizontal, idx) {
  const dir = Math.random() < 0.5 ? 1 : -1;
  if (level === 'laser') { hazards.push({ laser: true, horizontal, idx, dir, warn: 60, phase: 'warn', t: 0 }); return; }
  const t = (Date.now() - startTime) / 1000;
  const v = cell * 0.05 * dir; // 3 格/秒（以 60 幀/秒換算） // 滾動速度固定
  hazards.push({
    horizontal, idx, v,
    x: horizontal ? (dir > 0 ? -cell : size + cell) : (idx + 0.5) * cell,
    y: horizontal ? (idx + 0.5) * cell : (dir > 0 ? -cell : size + cell),
    warn: 60, r: cell * 0.4, dir, roll: 0, z: ZDROP, vz: 0, sm: 1, entered: false, landed: false, air: false,
    spots: Array.from({ length: 15 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.7, size: 0.08 + Math.random() * 0.16 })),
    specks: Array.from({ length: 40 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.8, size: 0.025 + Math.random() * 0.045, light: Math.random() < 0.45 })),
    cracks: Array.from({ length: 6 }, () => ({ phi: Math.random() * Math.PI * 2, lat: (Math.random() - 0.5) * 1.4, dphi: (Math.random() - 0.5) * 0.9, dlat: (Math.random() - 0.5) * 0.7 })),
    shape: Array.from({ length: 9 }, () => 0.9 + Math.random() * 0.16)
  });
}

// 每一波同時出現多顆石頭，時間越久數量越多（最多 5 顆）
// 每波之間的間隔（幀數）隨時間縮短：從 70 幀降到 30 幀，比一波的滾動時間短，所以方格內會同時有好幾波
const WAVE_PTS = [[0, 115], [10, 113], [20, 105], [30, 93], [40, 80], [50, 55], [60, 30]];
const waveInterval = elapsed => { if (elapsed >= 60) return 30; let k = 1; while (WAVE_PTS[k][0] < elapsed) k++; const a = WAVE_PTS[k - 1], b = WAVE_PTS[k]; return Math.round(a[1] + (b[1] - a[1]) * (elapsed - a[0]) / (b[0] - a[0])); };
function spawnWave(elapsed) {
  if (level === 'missile') { spawnMissiles(elapsed); return; }
  if (level === 'balloon') { spawnBalloons(elapsed); return; }
  const count = Math.min(8, 2 + Math.floor(elapsed / 10));
  // 場上已有的石頭也算進去：不重複同一條線，橫向、直向各最多 4 條，確保永遠有安全格
  const used = new Set();
  let rows = 0, cols = 0, tries = 0, spawned = 0;
  hazards.forEach(h => {
    if (h.laser ? h.phase === 'fire' : h.warn <= 0) return; // 已經射出的石頭不佔用線，下一波不用等它滾完（激光則是蓄力完成、開始發射後才釋出）
    const key = (h.horizontal ? 'h' : 'v') + h.idx;
    if (used.has(key)) return;
    used.add(key);
    if (h.horizontal) rows++; else cols++;
  });
  while (spawned < count && tries++ < 50) {

    if (used.has(key)) continue;
    used.add(key);
    if (horizontal) rows++; else cols++;
    spawnHazard(horizontal, idx);

  }
}

// ===== 低窪地形：方格內是比外圍草地低的盆地，邊緣是一道落差 =====
const RIM = cell * 0.45;       // 落差邊緣的坡面寬度（很陡）
const ZDROP = cell * 0.6;      // 落差高度（畫面上的像素）
const GRAV = cell * 0.018;     // 下墜加速度（每幀）
function terrainDepth(x, y) {  // x、y 為方格座標（0 ~ size）；方格外 = 0，盆地底部 = 1
  const a = x, b = size - x, c = y, d = size - y;
  if (a <= 0 || b <= 0 || c <= 0 || d <= 0) return 0;
  const e = Math.pow(Math.pow(a, -4) + Math.pow(b, -4) + Math.pow(c, -4) + Math.pow(d, -4), -0.25); // 圓角
  if (e >= RIM) return 1;
  const t = e / RIM;
  return t * t * (3 - 2 * t);
}
// 泥土地打光：光源在左上。坡面朝向光源較亮、背光較暗；上方與左側的邊緣會在盆地內投下陰影
function applyTerrainShading(b) {
  const x0 = Math.round(pad), y0 = Math.round(pad);
  const img = b.getImageData(x0, y0, size, size), px = img.data;
  const K2 = RIM * 0.9, SW = cell * 0.9;
  for (let j = 0; j < size; j++) {
    for (let i = 0; i < size; i++) {
      const dep = terrainDepth(i, j);
      const gx = (terrainDepth(i + 1, j) - terrainDepth(i - 1, j)) / 2;
      const gy = (terrainDepth(i, j + 1) - terrainDepth(i, j - 1)) / 2;
      const lit = -(gx + gy) * 0.5 * K2;
      const sh = Math.max(0, 1 - i / SW, 1 - j / SW);
      const f = Math.max(0.25, 1 + lit * 1.1) * (1 - 0.12 * dep) * (1 - 0.5 * sh);
      const k = (j * size + i) * 4;
      px[k] = Math.min(255, px[k] * f);
      px[k + 1] = Math.min(255, px[k + 1] * f);
      px[k + 2] = Math.min(255, px[k + 2] * f);
    }
  }
  b.putImageData(img, x0, y0);
}
// 石頭靠自己的力量往前滾：滾到邊緣時水平速度完全不變，只是高度很快地落下一小段、著地時砸出聲音與塵土，
// 然後直接繼續滾，不停頓。離開盆地時則沿著對側邊緣平順升回高地。
function updateFall(h, dt) {
  const u = h.horizontal ? h.x : h.y;
  if (!h.entered) {
    h.air = false;
    if (h.dir > 0 ? u >= 0 : u <= size) { h.entered = true; h.vz = 0; } else return;
  }
  const over = h.dir > 0 ? u - size : -u; // 越過對側邊緣的距離
  if (over > 0) { h.air = false; h.sm = 1; h.z = Math.min(ZDROP, (ZDROP * over) / (cell * 0.5)); return; }
  if (!h.landed) {
    h.air = true;
    h.vz += GRAV * dt;
    h.z -= h.vz * dt;
    if (h.z <= 0) { h.z = 0; h.landed = true; h.air = false; sfxLand(1.1); landDust(h); }
  } else {
    h.air = false;
    h.sm += (1 - h.sm) * Math.min(1, 0.2 * dt);
  }
}
function landDust(h) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.6 + 0.4;
    particles.push({ x: h.x + Math.cos(a) * h.r * 0.6, y: h.y + Math.sin(a) * h.r * 0.6, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.3, size: Math.random() * 7 + 4, life: 0.9, dust: true });
  }
}

    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(8), Y(6)); ctx.lineTo(X(6), Y(13));
  } else {
    let lK = [lx * 0.4, 12], lF = [lx, 18], rK = [rx * 0.4, 12], rF = [rx, 18];

    if (sv < 0) { rK = [rx * 0.4 + (9 - rx * 0.4) * se, 12 - 6 * se]; rF = [rx + (6 - rx) * se, 18 - 5 * se]; }

    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(lK[0]), Y(lK[1])); ctx.lineTo(X(lF[0]), Y(lF[1]));
    ctx.moveTo(X(0), Y(8)); ctx.lineTo(X(rK[0]), Y(rK[1])); ctx.lineTo(X(rF[0]), Y(rF[1]));

  };

  // 腳下的陰影：只在腳底正下方
  const gs = ctx.createRadialGradient(0, 18.5, 1, 0, 18.5, 10);
  gs.addColorStop(0, 'rgba(15,6,0,0.42)'); gs.addColorStop(1, 'rgba(15,6,0,0)');
  ctx.fillStyle = gs;
  ctx.beginPath(); ctx.ellipse(0, 18.5, 10 * sx, 3.2 * sy + 0.8, 0, 0, Math.PI * 2); ctx.fill();

  // 身體：黑色細線條；頭：純白填滿、黑色描邊
  if (wt >= 0) {
    const pr = 8 + Math.min(1, wt / 1.2) * 12;
    ctx.fillStyle = 'rgba(120,200,255,0.5)'; ctx.beginPath(); ctx.ellipse(0, 18.5, pr * sx, pr * 0.3 * sy + 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.ellipse(0, 18.5, pr * sx, pr * 0.3 * sy + 0.5, 0, 0, Math.PI * 2); ctx.stroke();

  }

    ctx.save(); headPath(); ctx.clip(); ctx.strokeStyle = 'rgba(90,170,230,0.75)'; ctx.lineWidth = 1.2;
    [-6, -1.5, 3.5, 7].forEach((hx, q) => { ctx.beginPath(); ctx.moveTo(X(hx), Y(-24)); ctx.lineTo(X(hx + (q % 2 ? 1 : -1)), Y(-4)); ctx.stroke(); });
    ctx.restore();

    [[-7, 9], [7, 9], [0, -1], [-10, -6], [10, -6], [-3, 8], [4, 12]].forEach((a, q) => {

// pose 專用的道具：秀肌肉時雙手握拳
function drawPoseExtras(pose, X, Y) {

// 被石頭撞到後，人物隨著石頭滾過去的位置被壓扁
function updateSquash() {
  const h = player.hit;
  if (!isGameOver || !h) return;
  const along = (h.horizontal ? h.x - player.px : h.y - player.py) * h.dir; // 負 = 石頭還沒到，正 = 已經滾過
  const t = Math.min(1, Math.max(0, (along + h.r * 0.9) / (h.r * 1.2)));
  player.sq = Math.max(player.sq || 0, t);
  if (!player.puffed && player.sq > 0.5) {
    player.puffed = true;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, sp = Math.random() * 1.8 + 0.4;
      particles.push({ x: player.px + Math.cos(a) * cell * 0.15, y: player.py + cell * 0.2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5 - 0.2, size: Math.random() * 6 + 3, life: 0.9, dust: true });
    }

}

// 方格外的箭頭提示：出現在石頭進場的那一側
function arrowPos(h) {
  let ax, ay, ang;
  if (h.horizontal) {
    ax = h.dir > 0 ? -pad / 2 : size + pad / 2;
    ay = (h.idx + 0.5) * cell;
    ang = h.dir > 0 ? 0 : Math.PI;
  } else {
    ax = (h.idx + 0.5) * cell;
    ay = h.dir > 0 ? -pad / 2 : size + pad / 2;
    ang = h.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
  return { ax, ay, ang };
}
function drawArrow(h) {
  const { ax, ay, ang } = arrowPos(h);
  const L = pad * 1.3;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang);
  ctx.translate(L / 2 - pad * 0.46, 0);
  ctx.fillStyle = '#ff3b30';
  ctx.beginPath();
  // 有尾巴的箭頭：細長的箭桿 + 三角形箭頭
  const hh = Math.min(cell * 0.34, L * 0.55), w = hh * 0.5, hx = -L * 0.12; // 箭桿半寬、箭頭半寬、箭頭起點
  ctx.moveTo(-L / 2, -w);
  ctx.lineTo(hx, -w);
  ctx.lineTo(hx, -hh);
  ctx.lineTo(L / 2, 0);
  ctx.lineTo(hx, hh);
  ctx.lineTo(hx, w);
  ctx.lineTo(-L / 2, w);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';

// 石頭：不規則多邊形，邊移動邊滾動
function drawRock(h) {
  const n = h.shape.length;
  // 地面陰影
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath();
  if (h.horizontal) ctx.ellipse(h.x, h.y + h.r * 0.95, h.r * 0.9, h.r * 0.22, 0, 0, Math.PI * 2);
  else ctx.ellipse(h.x + h.r * 0.95, h.y, h.r * 0.22, h.r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.rotate(h.rot);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = h.r * h.shape[i];
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#8d8d8d';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#4a4a4a';
  ctx.stroke();
  // 裂紋（跟著石頭旋轉）
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(40,40,40,0.55)';
  ctx.beginPath();
  ctx.moveTo(-h.r * 0.1, -h.r * 0.55); ctx.lineTo(h.r * 0.12, -h.r * 0.1); ctx.lineTo(-h.r * 0.2, h.r * 0.25); ctx.lineTo(-h.r * 0.05, h.r * 0.6);
  ctx.moveTo(h.r * 0.12, -h.r * 0.1); ctx.lineTo(h.r * 0.5, h.r * 0.05);
  ctx.stroke();
  // 光源固定在左上，不隨石頭旋轉
  ctx.rotate(-h.rot);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(-h.r * 0.3, -h.r * 0.35, h.r * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.arc(h.r * 0.25, h.r * 0.3, h.r * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 立體滾動的石頭：輪廓不轉，表面的斑塊沿行進方向滾過去
// （滾動角度 = 位移 / 半徑），越到邊緣越扁、轉到背面就消失，橫向與直向都一樣
function drawRockRolling(h) {
  const zr = h.z / ZDROP, lift = 1 + 0.9 * zr; // 位置越高，石頭看起來越大、陰影離得越遠
  const R = h.r * (1 + 0.12 * zr), n = h.shape.length;
  const trace = () => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2, rr = R * h.shape[i];
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(h.x + R * 0.2 * lift, h.y + R * 0.3 * lift, R * 1.0, R * 0.9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.translate(h.x, h.y - h.z * 0.6); // 在空中時，石頭本體往上偏，陰影留在地面
  trace();
  const g = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R * 1.1);
  g.addColorStop(0, '#b9b6af'); g.addColorStop(0.6, '#8a8782'); g.addColorStop(1, '#5a5753');
  ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.clip();
  for (const s of h.spots) {
    const a = s.phi + h.roll, c = Math.cos(a);
    if (c <= 0.05) continue;
    const u = Math.sin(a) * R * 0.95 * Math.sqrt(1 - s.lat * s.lat), w = s.lat * R * 0.95;
    const sz = s.size * R * 1.8;
    const rx = h.horizontal ? sz * c : sz, ry = h.horizontal ? sz : sz * c;
    ctx.fillStyle = `rgba(45,42,40,${0.6 * c})`;
    ctx.beginPath(); ctx.ellipse(h.horizontal ? u : w, h.horizontal ? w : u, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(210,206,198,${0.22 * c})`;
    ctx.beginPath(); ctx.ellipse((h.horizontal ? u : w) - 2, (h.horizontal ? w : u) - 2, rx * 0.5, ry * 0.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 更細的顆粒（深色小坑洞與淺色礦物點）
  for (const q of h.specks) {
    const a = q.phi + h.roll, c = Math.cos(a);
    if (c <= 0.05) continue;
    const u = Math.sin(a) * R * 0.95 * Math.sqrt(1 - q.lat * q.lat), w = q.lat * R * 0.95, sz = q.size * R * 1.8;
    const px = h.horizontal ? u : w, py = h.horizontal ? w : u;
    ctx.fillStyle = q.light ? `rgba(225,222,214,${0.5 * c})` : `rgba(35,32,30,${0.7 * c})`;
    ctx.beginPath(); ctx.ellipse(px, py, h.horizontal ? sz * c : sz, h.horizontal ? sz : sz * c, 0, 0, Math.PI * 2); ctx.fill();
  }
  // 裂紋（跟著石頭一起滾動）
  ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (const k of h.cracks) {
    const a1 = k.phi + h.roll, a2 = a1 + k.dphi, c1 = Math.cos(a1), c2 = Math.cos(a2);
    if (c1 <= 0.1 || c2 <= 0.1) continue;
    const l2 = Math.max(-0.95, Math.min(0.95, k.lat + k.dlat));
    const u1 = Math.sin(a1) * R * 0.95 * Math.sqrt(1 - k.lat * k.lat), w1 = k.lat * R * 0.95;
    const u2 = Math.sin(a2) * R * 0.95 * Math.sqrt(1 - l2 * l2), w2 = l2 * R * 0.95;
    ctx.strokeStyle = `rgba(30,28,26,${0.6 * Math.min(c1, c2)})`;
    ctx.beginPath();
    ctx.moveTo(h.horizontal ? u1 : w1, h.horizontal ? w1 : u1);
    ctx.lineTo(h.horizontal ? u2 : w2, h.horizontal ? w2 : u2);
    ctx.stroke();
  }
  ctx.restore();
  trace();
  ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = '#45423e'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.arc(-R * 0.3, -R * 0.38, R * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ===== 激光關卡 =====
// 流程：箭頭閃爍提示 → 箭頭位置出現發射器並蓄力 → 整列（整行）發射激光 → 激光消退
const LASER_CHARGE = 40;  // 蓄力的幀數（以 60 幀/秒換算，約 0.67 秒）
const LASER_FIRE = 26;    // 激光持續的幀數（約 0.43 秒）

// 發射器：安裝在方格外、箭頭的位置，蓄力時炮口前端有一團火光，越來越亮
function drawEmitter(h, p, glow) {
  const { ax, ay, ang } = arrowPos(h);
  const L = pad * 0.98;
  ctx.save();
  ctx.translate(ax, ay);
  ctx.rotate(ang); // +x 是發射方向

  ctx.fillStyle = '#2b2f36'; ctx.strokeStyle = '#9aa1ab'; ctx.lineWidth = 2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-L * 0.45, -cell * 0.36, L * 0.9, cell * 0.72, cell * 0.08); else ctx.rect(-L * 0.45, -cell * 0.36, L * 0.9, cell * 0.72);
  ctx.fill(); ctx.stroke();

  // 鏡頭：蓄力時只在炮口（發射器前端）有一團火光，隨蓄力慢慢變亮

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// 激光：整列（整行）一道光束，外圈光暈 + 紅色光芒 + 白色亮芯，強度 e（0~1）
function drawBeam(h, e) {
  const yc = (h.idx + 0.5) * cell;
  const { ax, ay } = arrowPos(h), muzzle = (h.horizontal ? ax : ay) + h.dir * pad * 0.98 * 0.28;
  const lo = h.dir > 0 ? muzzle : -pad, hi = h.dir > 0 ? size + pad : muzzle, len = hi - lo;
  const jit = 0.92 + 0.08 * Math.random();
  ctx.save();
  const layer = (T, col) => {
    ctx.strokeStyle = col; ctx.lineWidth = T; ctx.lineCap = 'round';
    ctx.beginPath();
    if (h.horizontal) { ctx.moveTo(lo, yc); ctx.lineTo(hi, yc); } else { ctx.moveTo(yc, lo); ctx.lineTo(yc, hi); }
    ctx.stroke();
  };
  layer(cell * 1.0 * e * jit, 'rgba(255,60,10,0.4)');
  layer(cell * 0.72 * e * jit, 'rgba(255,90,15,0.65)');
  layer(cell * 0.4 * e, 'rgba(255,135,30,0.88)');
  layer(cell * 0.16 * e, 'rgba(255,225,160,1)');
  ctx.restore();
  // 沿著光束迸出的火花
  if (e > 0.3) {
    for (let k = 0; k < 2; k++) {
      const u = lo + Math.random() * len, s = (Math.random() - 0.5) * 3;
      particles.push({ x: h.horizontal ? u : yc, y: h.horizontal ? yc : u, vx: h.horizontal ? (Math.random() - 0.5) * 2 : s, vy: h.horizontal ? s : (Math.random() - 0.5) * 2, size: 2 + Math.random() * 2, life: 1, spark: true });
    }
  }
}

// ===== 飛彈關卡：紅色範圍圈由小變大（鎖定）→ 飛彈從上方落下 → 打到地板爆炸，範圍內的人會被炸到 =====
const MISSILE_LOCK = 72;
const MISSILE_DROP = 26;
const MISSILE_BOOM = 50;
const MISSILE_R = cell * 0.55;
function spawnMissiles(elapsed) {
  const count = Math.min(10, 5 + Math.floor(elapsed / 8));
  const used = new Set();
  hazards.forEach(h => { if (h.missile) used.add(h.c + ',' + h.r); });
  let n = 0, tries = 0;
  while (n < count && tries++ < 60) {
    let c = Math.floor(Math.random() * N), r = Math.floor(Math.random() * N);
    if (n === 0 && Math.random() < 0.6) { c = player.c; r = player.r; }
    const key = c + ',' + r;
    if (used.has(key)) continue;
    used.add(key);
    hazards.push({ missile: true, c, r, phase: 'lock', t: 0 });
    n++;
  }
}
function updateMissile(h, dt, i) {
  const x = (h.c + 0.5) * cell, y = (h.r + 0.5) * cell;
  h.t += dt;

    const p = Math.min(1, h.t / MISSILE_LOCK), rad = MISSILE_R * (0.1 + 0.9 * p);

    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, `rgba(255,40,30,${(0.12 + 0.3 * p) * blink})`); g.addColorStop(1, `rgba(255,40,30,${(0.28 + 0.4 * p) * blink})`);

    ctx.lineWidth = 3; ctx.strokeStyle = `rgba(255,70,50,${0.95 * blink})`; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,80,60,0.55)'; ctx.beginPath(); ctx.arc(x, y, MISSILE_R, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,70,50,${0.8 * blink})`; ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();

    const q = Math.min(1, h.t / MISSILE_DROP), my = y - cell * 5 * (1 - q * q);
    ctx.fillStyle = `rgba(255,40,30,${0.4 + 0.15 * Math.sin(h.t)})`; ctx.beginPath(); ctx.arc(x, y, MISSILE_R, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,80,60,0.95)'; ctx.beginPath(); ctx.arc(x, y, MISSILE_R, 0, Math.PI * 2); ctx.stroke();
    ctx.save(); ctx.translate(x, my); ctx.scale(2.1, 2.1);

function updateLaser(h, dt, i) {
  if (h.phase === 'warn') {
    h.warn -= dt;
    if (Math.floor(h.warn / 5) % 2 === 0) drawArrow(h);
    if (h.warn <= 0) { h.phase = 'charge'; h.t = 0; sfxCharge(); }
    return;
  }
  h.t += dt;
  if (h.phase === 'charge') {
    drawEmitter(h, Math.min(1, h.t / LASER_CHARGE), 1);
    if (h.t >= LASER_CHARGE) { h.phase = 'fire'; h.t = 0; sfxLaser(); }
    return;
  }
  const f = h.t;
  const e = Math.min(1, f / 3) * (f > LASER_FIRE - 8 ? Math.max(0, (LASER_FIRE - f) / 8) : 1);
  drawBeam(h, e);
  drawEmitter(h, 1 + 1.5 * e, Math.max(0.35, e));
  if (!isGameOver && e > 0.55) {
    const dist = h.horizontal ? Math.abs(player.py - (h.idx + 0.5) * cell) : Math.abs(player.px - (h.idx + 0.5) * cell);
    if (dist < cell * 0.38) {
      player.zap = performance.now();
      shakeTime = 8;
      sfxZapDie();
      endGame();
    }
  }
  if (f >= LASER_FIRE) hazards.splice(i, 1);
}

// 結束遊戲：記錄成績（每個關卡各自的最佳紀錄），稍後顯示結算畫面
function endGame() {
  isGameOver = true;
  const secs = parseFloat(ui.innerText);
  const isNew = secs > bests[level];
  if (isNew) {
    bests[level] = secs;
    try { localStorage.setItem(level === 'laser' ? 'mrOopsBestLaser' : level === 'missile' ? 'mrOopsBestMissile' : level === 'balloon' ? 'mrOopsBestBalloon' : 'mrOopsBest', String(secs)); } catch (e) {}
    showBest(); saveBestRemote();
  }
  finalScore.innerText = `你撐了 ${ui.innerText}` + (isNew ? '（新紀錄！）' : '');
  setTimeout(() => { if (isGameOver) gameoverScreen.style.display = 'flex'; }, level === 'laser' ? 900 : level === 'missile' || level === 'balloon' ? 1100 : 1000);
}

let lastT = performance.now();
let fpsFrames = 0, fpsLast = performance.now();
const fpsEl = document.getElementById('fps');
function loopInner() {
  // 用實際經過的時間換算，不管螢幕更新率多少，石頭的滾動速度都一樣
  const nowT = performance.now();
  const dt = Math.min(3, (nowT - lastT) / (1000 / 60));
  lastT = nowT;
  fpsFrames++;
  if (nowT - fpsLast >= 500) {
    fpsEl.innerText = Math.round((fpsFrames * 1000) / (nowT - fpsLast)) + ' FPS';
    fpsFrames = 0; fpsLast = nowT;
  }
  if (inMenu || paused) { requestAnimationFrame(loop); return; }
  ctx.save();
  if (shakeTime > 0) {
    ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
    shakeTime--;
  }
  ctx.translate(pad, pad);
  ctx.clearRect(-pad - 20, -pad - 20, size + 2 * pad + 40, size + 2 * pad + 40);
  ctx.drawImage(level === 'laser' ? bgVault : level === 'missile' ? bgSea : level === 'balloon' ? bgPark : bg2, -pad, -pad);
  drawGrid();
  if (level === 'missile') drawCraters();

  if (!isGameOver) {
    if (transitioning) { startTime = Date.now(); spawnTimer = 0; }
    const elapsed = ((Date.now() - startTime) / 1000);
    ui.innerText = elapsed.toFixed(2) + ' 秒';

    spawnTimer += dt;
    if (spawnTimer >= nextWave) { spawnWave(elapsed); spawnTimer = 0; nextWave = waveInterval(elapsed) * (0.6 + Math.random() * 0.8); }

    // 平滑移動到目標格
    const tx = (player.c + 0.5) * cell, ty = (player.r + 0.5) * cell;
    const lerp = Math.min(1, 0.35 * dt);
    player.px += (tx - player.px) * lerp;
    player.py += (ty - player.py) * lerp;
  }

  // 玩家（被撞到後，石頭會從身上碾過去，人物被壓扁留在地上；石頭畫在人物上面）
  updateSquash();
  if (player.zap && isGameOver && Math.random() < 0.35) { // 被電焦後冒煙
    particles.push({ x: player.px + (Math.random() - 0.5) * cell * 0.3, y: player.py - cell * 0.2, vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 0.5, size: 4 + Math.random() * 5, life: 0.8, dust: true });
  }
  drawStickman(player, player.sq || 0);

  for (let i = hazards.length - 1; i >= 0; i--) {
    const h = hazards[i];
    if (h.laser) { updateLaser(h, dt, i); continue; }
    if (h.missile) { updateMissile(h, dt, i); continue; }
    if (h.balloon) { updateBalloon(h, dt, i); continue; }
    if (h.warn > 0) {
      h.warn -= dt;
      if (Math.floor(h.warn / 5) % 2 === 0) drawArrow(h);
    } else {
      h.v = h.dir * cell * 0.05; // 滾動速度固定：每秒 3 格，過邊緣也不變
      if (h.horizontal) h.x += h.v * dt; else h.y += h.v * dt;
      updateFall(h, dt);
      h.roll += (h.v / h.r) * dt; // 轉動角度 = 位移 / 半徑，才像真的在滾
      if (Math.random() < 0.6) {
        const bx = h.horizontal ? h.x - Math.sign(h.v) * h.r * 0.8 : h.x + (Math.random() - 0.5) * h.r;
        const by = h.horizontal ? h.y + h.r * 0.8 : h.y - Math.sign(h.v) * h.r * 0.8;
        particles.push({ x: bx, y: by, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.7) * 0.8, size: Math.random() * 5 + 3, life: 0.6, dust: true });
      }
      drawRockRolling(h);

      if (!isGameOver && Math.hypot(player.px - h.x, player.py - h.y) < cell * 0.2 + h.r && h.z < ZDROP * 0.45) {
        shakeTime = 6;
        player.hit = h; player.sq = 0;
        sfxDie();
        endGame();
      }
      if (h.x < -cell * 2 || h.x > size + cell * 2 || h.y < -cell * 2 || h.y > size + cell * 2) hazards.splice(i, 1);
    }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; if (!pt.dust && !pt.spark) pt.vy += 0.3;
    pt.life -= pt.spark ? 0.09 : pt.dust ? 0.03 : 0.02;
    ctx.fillStyle = pt.spark ? `rgba(255, 190, 150, ${Math.max(pt.life, 0)})` : pt.dust ? `rgba(150, 140, 130, ${Math.max(pt.life, 0) * 0.6})` : `rgba(34, 34, 34, ${Math.max(pt.life, 0)})`;
    ctx.fillRect(pt.x, pt.y, pt.size, pt.size);
    if (pt.life <= 0) particles.splice(i, 1);
  }

  updateRollSound();
  ctx.restore();
  requestAnimationFrame(loop);

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  musicGain = actx.createGain(); sfxGain = actx.createGain();
  // 柔和限幅器：音量小時完全不改變聲音，只在過大時圓滑地削峰，避免爆音（不會像壓縮器那樣把整體音量拉高）
  const lim = actx.createWaveShaper(), cv = new Float32Array(2049);
  for (let i = 0; i < cv.length; i++) { const x = i / 1024 - 1, a = Math.abs(x); cv[i] = Math.sign(x) * (a < 0.6 ? a : 0.6 + 0.4 * Math.tanh((a - 0.6) / 0.4)); }
  lim.curve = cv; lim.connect(actx.destination);
  musicGain.connect(lim); sfxGain.connect(lim);
  applyVol();
  // 石頭滾動：低頻噪音 + 緩慢起伏，音量依場上滾動中的石頭數量變化
  const len = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  makeVoices();
  startMusic();
}

const midi = m => 440 * Math.pow(2, (m - 69) / 12);

const PENT = [69, 72, 74, 76, 79, 81];
let mStep = 0, mNext = 0;
// ===== 激光關卡音樂：150 BPM，四四拍底鼓 + 反拍嗨帽 + 軍鼓 + 脈衝低音 + 十六分音符琶音，節奏緊迫 =====

  const o = actx.createOscillator(), g = actx.createGain();

}

function scheduleLaserMusic() {
  const sd = 60 / 150 / 4; // 十六分音符
  if (mNext < actx.currentTime) mNext = actx.currentTime + 0.05;
  while (mNext < actx.currentTime + 0.6) {
    const s = mStep % 16, bar = Math.floor(mStep / 16) % 4;

    if (s % 4 === 2) noiseHit(mNext, 7000, 0, 0.1, 0.05);          // 反拍嗨帽
    if (s === 4 || s === 12) noiseHit(mNext, 0, 1800, 0.3, 0.16);  // 軍鼓
    if (s % 2 === 0) tone(midi(root + (s % 4 === 2 ? 12 : 0)), mNext, sd * 1.6, 'sawtooth', 0.11, musicGain); // 脈衝低音
    tone(midi(root + 24 + ch[[0, 1, 2, 3, 2, 1, 2, 3][s % 8]]), mNext, sd * 0.8, 'square', 0.045, musicGain);     // 琶音
    if (s === 0) tone(midi(root + 36), mNext, sd * 6, 'sawtooth', 0.04, musicGain); // 每小節開頭的高音刺
    mStep++; mNext += sd;

  burst(whooshBuf, 'lowpass', 300, 0.7, 1.0, 0.18, Math.random() * 0.3);

function updateRollSound() {
  if (!actx || !voices.length) return;
  const now = actx.currentTime;
  let n = 0;
  if (!isGameOver) {
    for (const h of hazards) {
      if (!h.laser && !h.missile && !h.balloon && h.warn <= 0 && !h.air && h.x > -cell && h.x < size + cell && h.y > -cell && h.y < size + cell) n++;
    }
  }
  n = Math.min(n, MAX_VOICES);
  const per = n ? (ROLL_LEVEL / Math.sqrt(n)) * (now < duckUntil ? 0.3 : 1) : 0;
  voices.forEach((o, i) => o.g.gain.setTargetAtTime(i < n ? per : 0, now, 0.08));
}
